name: Routine research operation
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [refresh, availability]
        default: refresh
  workflow_call:
    inputs:
      mode:
        type: string
        default: refresh
    secrets:
      NFL_SELECTION_GITHUB_REPOSITORY:
        required: false
      NFL_SELECTION_GITHUB_TOKEN:
        required: false
permissions:
  contents: read
  checks: read
concurrency:
  group: nfl-research-routine-publication
  cancel-in-progress: false
jobs:
  routine:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RESEARCH_BRANCH: research-serving
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-serving
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the approved original generation runtime
        run: python -m pip install -r requirements.txt
      - name: Require approved operational code before refresh
        run: python -c 'from weekly_learning.code_trust import approved_code; from weekly_learning.store import ROOT,Store; approved_code(Store(ROOT/"weekly_learning_state"))'
      - name: Prepare admitted results and the next forecast
        env:
          NFL_SELECTION_GITHUB_REPOSITORY: ${{ secrets.NFL_SELECTION_GITHUB_REPOSITORY }}
          NFL_SELECTION_GITHUB_TOKEN: ${{ secrets.NFL_SELECTION_GITHUB_TOKEN }}
        id: prepare
        if: inputs.mode != 'availability'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$RESEARCH_BRANCH"
          test "$RESEARCH_BRANCH" != main
          python -m weekly_learning.routine prepare --id "routine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Install and verify the Cloud serving runtime
        if: always()
        run: |
          python -m pip install -r research_runtime_profiles/week11-certifi-20261120-v1/requirements.lock
          python -m pip check
      - name: Refresh public availability evidence only
        if: inputs.mode == 'availability'
        run: python -m weekly_learning.routine availability --id "availability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Publish only the validated routine release
        env:
          NFL_SELECTION_GITHUB_REPOSITORY: ${{ secrets.NFL_SELECTION_GITHUB_REPOSITORY }}
          NFL_SELECTION_GITHUB_TOKEN: ${{ secrets.NFL_SELECTION_GITHUB_TOKEN }}
        if: inputs.mode != 'availability'
        run: python -m weekly_learning.routine publish --id "routine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Persist only authorised research state
        if: always()
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$RESEARCH_BRANCH"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from weekly_learning.admission import validate_receipt
          root=Path('weekly_learning_state')
          paths=[str(p) for p in root.iterdir() if p.name not in {'sources','builds'} and not p.name.startswith('.') and not p.name.endswith('.lock')]
          policy=json.loads(Path('weekly_learning/policy.json').read_text())
          for source in (root/'sources').glob('*'):
              receipt=source/'operational_admission.json'
              if receipt.exists():
                  try: validate_receipt(Path.cwd(),receipt,policy)
                  except (OSError,ValueError,KeyError,TypeError): continue
                  paths.append(str(source))
          paths += [str(p) for p in Path('research_inference_releases').glob('weekly-*')]
          paths += [str(p) for p in Path('research_runtime_profiles').glob('routine-*')]
          # Never persist partial pointers, even if an earlier publication stage failed.
          if Path('research_weekly_serving_active.json').exists():
              from research_platform.weekly_serving import selected
              assert selected() is not None
          if Path('research_weekly_serving_active.json').exists():paths.append('research_weekly_serving_active.json')
          if paths:subprocess.run(['git','add','--',*paths],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(n.startswith(('weekly_learning_state/','research_inference_releases/weekly-','research_runtime_profiles/routine-')) or n=='research_weekly_serving_active.json' for n in names)
          PY
          git config user.name 'NFL routine research publication'
          git config user.email 'research-learning@users.noreply.github.com'
          git commit -m 'Publish validated routine research state'
          git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
