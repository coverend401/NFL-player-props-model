name: Update NFL Data

on:
  schedule:
    - cron: '0 9 * * 2'  # every Tuesday at 9am UTC
  workflow_dispatch:      # lets you trigger it manually too
  permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nfl_data_py pandas pyarrow

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/weekly_player_data.parquet
          git commit -m "Automated data update" || echo "No changes to commit"
          git push