name: Prepare weekly forecast candidate
on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:
# Preparation only: this token cannot update a branch or deploy the app.
permissions:
  contents: read
concurrency:
  group: forecast-candidate-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Build and validate a fresh candidate without production files
        run: python scripts/prepare_release.py --id scheduled-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-forecast-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release_candidates/
          if-no-files-found: error
          retention-days: 14
# No git add/commit/push, active pointer change, production secrets or deployment step.
