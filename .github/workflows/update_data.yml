name: Update NFL Data

on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nfl_data_py pandas pyarrow scikit-learn scipy joblib

      - name: Run update script
        run: python scripts/update_data.py

      - name: Build features
        run: python scripts/build_features.py

      - name: Train models
        run: python scripts/train_all_markets.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Automated data + model update" || echo "No changes to commit"
          git push