name: Forecast regression and release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Validate committed candidate bundles on the production target
        if: matrix.python-version == '3.14'
        run: |
          if [ -d release_candidates ]; then
            python scripts/validate_release.py --all-candidates --app-smoke
            python scripts/rehearse_release.py --all-current-candidates
          fi
          python -c 'from pathlib import Path; from release_utils import resolve_release; resolve_release(Path.cwd())'
      - name: Validate isolated Stage 1B research artifacts and dashboard
        if: matrix.python-version == '3.14'
        run: |
          for manifest in experiments/stage1b/*/manifest.json; do
            if [ -f "$manifest" ]; then python -m stage1b.cli "$(dirname "$manifest")"; fi
          done
          python -c 'from streamlit.testing.v1 import AppTest; a=AppTest.from_file("stage1b_dashboard.py",default_timeout=90).run(); assert not a.exception, [e.message for e in a.exception]'
      - name: Validate isolated Stage 1B.1 research comparisons
        if: matrix.python-version == '3.14'
        run: |
          for manifest in experiments/stage1b1/*/manifest.json; do
            if [ -f "$manifest" ]; then python scripts/verify_stage1b1.py "$(dirname "$manifest")"; fi
          done
      - name: Validate C0-C2 research ablations and replay every model
        if: matrix.python-version == '3.14'
        run: |
          for manifest in experiments/stage1c/*/manifest.json; do
            if [ -f "$manifest" ]; then python -m stage1c.artifacts "$(dirname "$manifest")" --replay; fi
          done
      - name: Validate controlled Stage 1C.1 diagnostics and replay every model
        if: matrix.python-version == '3.14'
        run: |
          for manifest in experiments/stage1c1/*/manifest.json; do
            if [ -f "$manifest" ]; then python -m stage1c1.artifacts "$(dirname "$manifest")" --replay; fi
          done
