name: Forecast regression and release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Validate committed candidate bundles on the production target
        if: matrix.python-version == '3.14'
        run: |
          if [ -d release_candidates ]; then
            python scripts/validate_release.py --all-candidates --app-smoke
          fi
          python -c 'from pathlib import Path; from release_utils import resolve_release; resolve_release(Path.cwd())'
